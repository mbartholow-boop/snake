<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Clash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    color: #fff;
  }
  #wrapper {
    position: relative;
    border: 2px solid #fff;
    image-rendering: pixelated;
  }
  canvas {
    display: block;
    width: 800px;
    height: 480px;
    image-rendering: pixelated;
  }
  #hint {
    margin-top: 8px;
    font-size: 12px;
    color: #888;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="game" width="400" height="240"></canvas>
</div>
<div id="hint">ARROW KEYS — D-PAD &nbsp;|&nbsp; Z — ABILITY &nbsp;|&nbsp; C — CRANK BOOST &nbsp;|&nbsp; ENTER — SELECT</div>
<script src="game.js"></script>
</body>
</html>
